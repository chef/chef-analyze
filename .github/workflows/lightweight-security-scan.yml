name: Lightweight security scan

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  gosec-s3-utils-strict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Strict scan for session token path
        run: |
          set -o pipefail
          "$(go env GOPATH)/bin/gosec" -fmt=json -no-fail -include=G115,G301,G304 ./cmd/... > gosec.json
          python3 - <<'PY'
import json
import pathlib
import sys

with open("gosec.json", "r", encoding="utf-8") as f:
    data = json.load(f)

issues = data.get("Issues") or []
target = pathlib.PurePosixPath("/cmd/s3_utils.go")
target_issues = [
    i for i in issues
    if str(i.get("file", "")).endswith(str(target))
]

if target_issues:
    print("Found strict-path gosec issues in cmd/s3_utils.go:")
    for item in target_issues:
        print(f"- {item.get('rule_id')} at {item.get('file')}:{item.get('line')}: {item.get('details')}")
    sys.exit(1)

print("No strict-path gosec issues found in cmd/s3_utils.go")
PY
