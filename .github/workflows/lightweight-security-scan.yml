name: Lightweight security scan

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  gosec-cmd-strict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Strict scan for cmd folder
        run: |
          set -o pipefail
          "$(go env GOPATH)/bin/gosec" -fmt=json -no-fail -include=G104,G115,G204,G301,G304 ./cmd/... > gosec.json
          python3 - <<'PY'
import json
import sys

with open("gosec.json", "r", encoding="utf-8") as f:
    data = json.load(f)

issues = data.get("Issues") or []
cmd_issues = [
    i for i in issues
    if "/cmd/" in str(i.get("file", "")).replace("\\\\", "/")
]

if cmd_issues:
    print("Found strict-path gosec issues in cmd folder:")
    for item in cmd_issues:
        print(f"- {item.get('rule_id')} at {item.get('file')}:{item.get('line')}: {item.get('details')}")
    sys.exit(1)

print("No strict-path gosec issues found in cmd folder")
PY
